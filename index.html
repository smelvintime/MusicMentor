<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MusicMentor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%234a9eff'/><ellipse cx='9' cy='16.5' rx='3' ry='2.3' fill='white'/><path d='M11.6 16V6l5 1.6' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round'/></svg>">
<style>
  :root {
    --bg: #0d0d0f; --card: #1e1e21; --card2: #2a2a2e; --ink: #f2f2f4; --dim: #8e8e93;
    --accent: #4a9eff; --ok: #34c759; --bad: #ff453a; --hl: #ef5350;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* App, not a document: no text selection or iOS long-press callout */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  [hidden] { display: none !important; }
  .screen { max-width: 520px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column;
    padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom)); }

  /* Home */
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -.5px; margin: 0; }
  .muted { color: var(--dim); font-size: 14px; }
  .home-top { padding: 16px 4px 18px; }
  .chip { padding: 8px 14px; border-radius: 999px; background: var(--card); font-size: 14px; }
  .settings { background: var(--card); border-radius: 16px; padding: 4px 14px; margin-bottom: 22px; }
  .set-row { display: flex; align-items: center; justify-content: space-between; min-height: 52px; font-size: 15px; }
  .set-row + .set-row { border-top: 1px solid var(--card2); }
  .seg { display: flex; background: var(--bg); border-radius: 999px; padding: 3px; }
  .seg button { padding: 6px 14px; border-radius: 999px; color: var(--dim); font-size: 14px; font-variant-numeric: tabular-nums; }
  .seg button.on { background: var(--card2); color: var(--accent); }
  .switch { flex: none; width: 51px; height: 31px; border-radius: 999px; background: var(--card2); position: relative; transition: background .2s; margin-left: 12px; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch.on { background: var(--bad); }
  .switch.on::after { transform: translateX(20px); }
  .set-row .muted { font-size: 12px; }
  .mix { width: 100%; display: flex; align-items: center; justify-content: space-between; text-align: left;
    background: linear-gradient(135deg, #2d6fd6, #4a9eff); border-radius: 20px; padding: 18px; margin-bottom: 26px; }
  .mix b { font-size: 19px; }
  .mix .muted { color: #e6f0ff; }
  .mix .go { width: 44px; height: 44px; border-radius: 50%; background: #ffffff2e; display: grid; place-items: center; }
  .mix .go svg { width: 20px; height: 20px; fill: #fff; }
  .mix:active, .deck:active { transform: scale(.97); }
  .section { font-size: 13px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--dim); margin: 0 4px 10px; }
  .decks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 26px; }
  .deck { position: relative; text-align: left; background: var(--card); border-radius: 18px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; }
  .deck .pv { height: 56px; display: flex; align-items: center; margin-bottom: 6px; }
  .deck .pv svg { height: 56px; width: auto; max-width: 100%; filter: invert(.85); }
  .deck .pv .ear svg { filter: none; width: 34px; height: 34px; color: #d9d9d9; }
  .deck .pv .piano { height: 40px; width: 96px; pointer-events: none; }
  .deck b { font-size: 16px; }
  .deck .pv .slash { font-size: 30px; font-weight: 300; color: var(--dim); margin: 0 2px; }
  .pick { position: absolute; top: 6px; right: 6px; width: 40px; height: 40px; display: grid; place-items: center; }
  .pick::before { content: ''; position: absolute; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #48484d; }
  .pick svg { width: 14px; height: 14px; color: #fff; opacity: 0; position: relative; }
  .pick.on::before { background: var(--accent); border-color: var(--accent); }
  .pick.on svg { opacity: 1; }
  .mix > div { min-width: 0; }
  .mix .muted { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deck .muted { font-size: 13px; line-height: 1.3; }

  /* Quiz */
  .top { display: flex; align-items: center; justify-content: space-between; height: 44px; }
  .top .count { color: var(--dim); font-variant-numeric: tabular-nums; }
  .icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; }
  .icon svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon.off { opacity: .35; }
  .bar { height: 3px; background: var(--card); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
  .card { flex: 1; margin: 14px 0; background: var(--card); border-radius: 22px; padding: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    box-shadow: 0 14px 0 -6px #161618; min-height: 240px; }
  .ask { color: var(--dim); font-size: 15px; text-align: center; }
  .prompt { width: 100%; display: flex; justify-content: center; }
  .prompt svg { width: 100%; max-height: 280px; filter: invert(.95); }
  .bigtext { font-size: 72px; font-weight: 700; letter-spacing: -1px; }
  .ear svg { width: 72px; height: 72px; color: var(--ink); }
  .hint { background: var(--card2); border-radius: 12px; padding: 10px 12px; font-size: 14px; width: 100%; }
  /* Streak: compact pill pinned to the top of the card, so it never shifts the question */
  .card { position: relative; padding-top: 52px; }
  .streak { position: absolute; top: 12px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }
  .streak-box { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px;
    background: var(--card2); color: var(--ink); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .streak-box svg { width: 18px; height: 18px; }
  .streak-box .lost { color: var(--dim); }
  @keyframes long-pulse-burst {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(74, 158, 255, 0); }
    50% { transform: scale(1.15); box-shadow: 0 0 24px 6px rgba(74, 158, 255, .6); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(74, 158, 255, 0); }
  }
  .burst { animation: long-pulse-burst 1.5s ease-in-out forwards; }
  @keyframes wash-away { from { opacity: 1; transform: translateY(0); filter: blur(0); } to { opacity: 0; transform: translateY(-12px); filter: blur(4px); } }
  .wash { animation: wash-away 1.5s ease-in forwards; }
  #announce { position: fixed; inset: 0; background: rgba(0, 0, 0, .8); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    z-index: 100; display: flex; align-items: center; justify-content: center; animation: announce-fade-in .3s ease-out; }
  #announce[hidden] { display: none; }
  #announce .number { font-size: 96px; font-weight: 900; animation: announce-text-zoom .7s .2s cubic-bezier(.25, .46, .45, .94) both; }
  @keyframes announce-fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes announce-text-zoom { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes slow-pulse { 50% { opacity: .7; transform: scale(1.05); } }
  @keyframes rainbow-shift { to { background-position: 200% center; } }
  .announce-100 .number { color: #93c5fd; text-shadow: 0 0 15px #60a5fa, 0 0 25px #3b82f6; }
  .announce-200 .number { color: #d8b4fe; text-shadow: 0 0 15px #a855f7, 0 0 30px #a855f7; animation: announce-text-zoom .7s .2s both, slow-pulse 2.5s 1s ease-in-out infinite; }
  .announce-300 .number { background-image: linear-gradient(to right, #ef4444, #f97316, #eab308, #84cc16, #22c55e, #14b8a6, #06b6d4, #3b82f6, #8b5cf6, #d946ef, #ef4444);
    background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: announce-text-zoom .7s .2s both, rainbow-shift 3s linear infinite; }

  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choices.letters { grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .choices.three { grid-template-columns: 1fr; }
  .choice { background: var(--card); border-radius: 14px; min-height: 58px; padding: 8px; font-size: 18px; font-weight: 600; }
  .letters .choice { min-height: 64px; font-size: 22px; padding: 0; }
  .letters .choice.long { font-size: 13px; }
  #answer { touch-action: none; }
  .choice.press { background: var(--card2); transform: scale(.96); }
  .key.w.press { background: #b9c9e0; }
  .key.b.press { background: #4b5563; }
  .choice:active { background: var(--card2); }
  .choice.ok, .key.ok { background: var(--ok) !important; color: #fff; }
  .choice.bad, .key.bad { background: var(--bad) !important; color: #fff; }

  .piano { position: relative; height: 170px; width: 100%; user-select: none; }
  .key { position: absolute; top: 0; border-radius: 0 0 5px 5px; }
  .key.w { height: 100%; background: #f4f4f4; border: 1px solid #0d0d0f; }
  .key.b { height: 60%; background: #111; z-index: 1; border: 1px solid #0d0d0f; }
  .key.hl { background: var(--hl); }
  .key.sel { background: var(--accent); }
  .key small { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 9px; color: #888; }
  .prompt .piano { height: 130px; pointer-events: none; }

  .tabs { display: flex; justify-content: center; margin-top: 14px; }
  .tabs .seg { background: var(--card); padding: 4px; }
  .tabs button { padding: 8px 22px; }
  .next { margin-top: 14px; background: var(--accent); color: #fff; border-radius: 14px; height: 54px; font-weight: 600; width: 100%; }

  /* Learn sheet */
  .sheet { position: fixed; inset: 0; background: #000a; display: flex; align-items: flex-end; z-index: 9; }
  .sheet > div { background: var(--card); width: 100%; max-width: 520px; margin: 0 auto; border-radius: 22px 22px 0 0;
    padding: 20px 16px max(20px, env(safe-area-inset-bottom)); max-height: 85dvh; overflow: auto; }
  .sheet h2 { margin: 0 0 8px; }
  .sheet li { margin: 6px 0; }
  .ref { margin: 8px 0; }
  .examples { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 4px; }
  .ex { background: var(--card2); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 2px; text-align: left; }
  .ex:active { transform: scale(.97); }
  .ex .piano { height: 44px; pointer-events: none; margin-bottom: 6px; }
  .sheet li i { color: var(--accent); font-style: normal; }
  .hist { border-top: 1px solid var(--card2); padding: 14px 0; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
  .hist .prompt svg { max-height: 130px; }
  .hist .piano { height: 90px; pointer-events: none; }
  .hist .bigtext { font-size: 44px; }
  .hist .ear svg { width: 44px; height: 44px; }
  .verdict { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 18px; }
  .c-bad { color: var(--bad); } .c-ok { color: var(--ok); }
  .ref svg { width: 100%; filter: invert(.95); }

  /* Done */
  .done { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; text-align: center; }
  .score { font-size: 80px; font-weight: 800; }
  .missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 420px; }
  .missed span { background: var(--card); color: var(--bad); padding: 4px 10px; border-radius: 999px; font-size: 14px; }
  .row { display: flex; gap: 10px; width: 100%; }
  .row .next { flex: 1; }
  .row .next.alt { background: var(--card); }
</style>
</head>
<body>

<div id="home" class="screen">
  <div class="home-top">
    <h1>MusicMentor</h1>
  </div>
  <div class="settings">
    <div class="set-row">Cards per round
      <div class="seg">
        <button data-len="10">10</button><button data-len="20">20</button><button data-len="50">50</button><button data-len="0">∞</button>
      </div>
    </div>
    <div class="set-row"><div>Hard mode<div class="muted">Ledger lines, inversions, ties, syncopation, minor keys</div></div>
      <button class="switch" id="hard" role="switch" aria-label="Hard mode"></button></div>
  </div>
  <button class="mix" data-deck="mix">
    <div><b id="mixTitle">Mix everything</b><div class="muted" id="mixSub"></div></div>
    <span class="go"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
  </button>
  <div id="decks"></div>
</div>

<div id="quiz" class="screen" hidden>
  <div class="top">
    <button class="icon" id="quit" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <span class="count" id="count"></span>
    <span style="display:flex">
      <button class="icon" id="historyBtn" aria-label="Missed history"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></button>
      <button class="icon" id="learnBtn" aria-label="Learn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17.5h.01"/></svg></button>
      <button class="icon" id="sound" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg></button>
    </span>
  </div>
  <div class="bar"><i id="progress"></i></div>
  <div class="card" id="card">
    <div class="ask" id="ask"></div>
    <div class="prompt" id="prompt"></div>
    <div class="hint" id="hint" hidden></div>
    <div class="streak" id="streak"></div>
  </div>
  <div id="answer"></div>
  <button class="next" id="next" hidden>Continue</button>
  <div class="tabs" id="tabs">
    <div class="seg"><button data-mode="choices">Choices</button><button data-mode="keys">Piano</button></div>
  </div>
</div>

<div id="done" class="screen" hidden>
  <div class="done">
    <div class="muted" id="doneDeck"></div>
    <div class="score" id="score"></div>
    <div class="muted" id="doneSub"></div>
    <div class="missed" id="missed"></div>
    <button class="chip" id="review">Review misses</button>
  </div>
  <div class="row">
    <button class="next alt" id="homeBtn">Home</button>
    <button class="next" id="again">Again</button>
  </div>
</div>

<div id="announce" hidden></div>

<div class="sheet" id="sheet" hidden><div id="sheetBody"></div></div>

<script src="vexflow.js"></script>
<script src="theory.js"></script>
<script src="app.js"></script>
</body>
</html>
